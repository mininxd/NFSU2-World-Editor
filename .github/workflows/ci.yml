name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -v
      - name: CLI smoke test
        run: python -m nfsu2_world_editor.cli.chunkdump --help
      - name: Build add-on zip
        run: python build_addon.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: nfsu2_world_editor-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
