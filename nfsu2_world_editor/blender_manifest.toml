schema_version = "1.0.0"

id = "nfsu2_world_editor"
version = "0.4.1"
name = "NFSU2 World Editor"
tagline = "Import, edit and export NFSU2 world and car geometry and textures"
maintainer = "mininxd"
type = "add-on"
website = "https://github.com/mininxd/NFSU2-World-Editor"
tags = ["Import-Export"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read NFSU2 world files (.BUN) and write edited copies to a folder you choose"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
